server.port=8081

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ai-buyflow}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.sql.init.mode=always

logging.level.org.springframework.ai=DEBUG

spring.ai.mcp.server.name=product-catalog
spring.ai.mcp.server.version=1.0.0
